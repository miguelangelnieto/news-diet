<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Symbolic icon - matches v6 newspaper design -->
  <!-- Back page -->
  <path d="M3,3 L13,3 L13,12 Q13,13 12,13 L4,13 Q3,13 3,12 Z" fill="#4c566a"/>
  <!-- Front page -->
  <path d="M2,4 L12,4 L12,13 Q12,14 11,14 L3,14 Q2,14 2,13 Z" fill="#eceff4"/>
  <!-- Page edge -->
  <path d="M2,13 L11,13 L11,14 L3,14 Q2,14 2,13" fill="#d8dee9"/>
  <!-- Folded corner -->
  <path d="M12,4 L12,7 L9,7 L12,4" fill="#e5e9f0"/>
  <path d="M12,4 L9,7 L12,7 Z" fill="#b8bfd0"/>
  <!-- Vertical fold -->
  <line x1="5" y1="4" x2="5" y2="14" stroke="#d8dee9" stroke-width="0.5"/>
  <!-- Headline -->
  <rect x="6" y="5" width="5" height="0.5" rx="0.25" fill="#bf616a"/>
  <rect x="6" y="6.5" width="4" height="0.5" rx="0.25" fill="#d8dee9"/>
  <!-- Left column -->
  <rect x="6" y="8" width="2.5" height="0.5" rx="0.25" fill="#d8dee9"/>
  <rect x="6" y="9.5" width="2" height="0.5" rx="0.25" fill="#d8dee9"/>
  <rect x="6" y="11" width="2.5" height="0.5" rx="0.25" fill="#d8dee9"/>
  <rect x="6" y="12.5" width="2" height="0.5" rx="0.25" fill="#d8dee9"/>
  <!-- AI dot -->
  <circle cx="11" cy="12" r="0.5" fill="#5e81ac"/>
</svg>
