<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#2e3440" />

  <!-- Newspaper (Scaled to fit safe zone) -->
  <g transform="translate(32, 22) scale(0.5)">
      <defs>
        <linearGradient id="paper-grad-m" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#eceff4" />
          <stop offset="100%" stop-color="#e5e9f0" />
        </linearGradient>
      </defs>

      <!-- Newspaper Base -->
      <rect x="0" y="0" width="128" height="160" rx="16" fill="url(#paper-grad-m)" stroke="#d8dee9" stroke-width="2"/>

      <!-- Blue Header -->
      <path d="M0,16 Q0,0 16,0 L112,0 Q128,0 128,16 L128,48 L0,48 Z" fill="#5e81ac" />

      <!-- RSS Icon in Header -->
      <circle cx="28" cy="24" r="5" fill="#ebcb8b" />
      <path d="M24,34 A12,12 0 0 1 36,22" fill="none" stroke="#ebcb8b" stroke-width="4" stroke-linecap="round" />
      <path d="M24,42 A20,20 0 0 1 44,22" fill="none" stroke="#ebcb8b" stroke-width="4" stroke-linecap="round" />

      <!-- Accent dot -->
      <circle cx="108" cy="24" r="6" fill="#a3be8c" />
      
      <!-- Content lines -->
      <rect x="16" y="64" width="96" height="8" rx="4" fill="#bf616a" opacity="0.8" />
      <rect x="16" y="80" width="96" height="4" rx="2" fill="#d8dee9" />
      <rect x="16" y="92" width="96" height="4" rx="2" fill="#d8dee9" />
      <rect x="16" y="104" width="64" height="4" rx="2" fill="#d8dee9" />
  </g>
</svg>
